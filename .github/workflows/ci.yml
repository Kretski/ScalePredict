name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: pip install -e ".[dev]"

    - name: Test import
      run: |
        python -c "
        from scalepredict.monitor import WTwinMonitor
        from scalepredict.monitor.benchmark import run_benchmark
        import scalepredict
        print(f'scalepredict {scalepredict.__version__} OK')
        "

    - name: Test CLI demo
      run: scalepredict demo

    - name: Test WTwinMonitor
      run: |
        python -c "
        import numpy as np
        from scalepredict.monitor import WTwinMonitor
        from scalepredict.monitor.benchmark import generate_failure_run, generate_clean_run

        rng = np.random.default_rng(42)

        # Clean run — no alert expected
        monitor = WTwinMonitor()
        steps, losses = generate_clean_run(500, rng=rng)
        for s, l in zip(steps, losses):
            monitor.update(int(s), float(l))
        assert monitor.first_alert_step() is None, 'FAR test failed'
        print('Clean run: OK (no false alarm)')

        # Failure run — alert expected
        monitor2 = WTwinMonitor()
        steps, losses, true_step = generate_failure_run(500, 300, 'drift', rng=rng)
        for s, l in zip(steps, losses):
            monitor2.update(int(s), float(l))
        alert = monitor2.first_alert_step()
        print(f'Failure run: alert={alert}, true_step={true_step}')
        print('All tests passed.')
        "
